[platformio]
default_envs = firechan

[env:firechan]
platform = espressif32
board = m5stack-fire
framework = arduino
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

lib_deps =
    m5stack/M5Unified
    adafruit/Adafruit NeoPixel

build_flags =
    -D FIRECHAN_VERSION=\"0.6.0-voice-input\"
    -D CORE_DEBUG_LEVEL=3
